configuration:
  log_level:
    name: Log Level
    description: "Set the (global) log level (NOTE: only enable debug when needed)."
  branch:
    name: Github branch
    description: "Specify the branch (or PR) to install at startup."
  fork:
    name: Github fork
    description: "Specify the fork to install at startup. (e.g. music-assistant@git+https://github.com/music-assistant/server.git)"
  safe_mode:
    name: Safe mode
    description: "Start the Music Assistant server in safe mode where only the core controllers are started without any providers, to troubleshoot issues"
